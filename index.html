<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Roblox</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { 
            width: 100%; height: 100%; overflow: hidden; 
            font-family: 'Arial', sans-serif;
            background: #121212;
        }

        /* === PORTADA === */
        #portada {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #ffffff 0%, #e6e6e6 100%);
            display: flex; align-items: center; justify-content: center;
            z-index: 100; transition: opacity 0.5s ease;
        }
        .logo-roblox {
            font-family: 'Arial Black', sans-serif;
            font-size: clamp(50px, 15vw, 90px); font-weight: 900; letter-spacing: -3px;
            color: #000; text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        .letra-o { transform: rotate(12deg); display: inline-block; }

        /* === CREAR CUENTA === */
        #pantalla-crear-cuenta {
            display: none; width: 100%; height: 100%;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: white; flex-direction: column; padding: 4vw; padding-bottom: 8vw; 
            overflow-y: auto; position: relative;
        }
        .titulo-pagina { 
            font-size: clamp(24px, 6vw, 32px); font-weight: bold; text-align: center; 
            margin: 6vw 0; text-shadow: 0 0 20px rgba(0,162,255,0.3);
        }
        .formulario { max-width: 420px; margin: 0 auto; display: flex; flex-direction: column; gap: 4vw; }
        .etiqueta { font-size: 15px; color: #b0d4f1; margin-bottom: 1.5vw; display: block; }
        .entrada {
            width: 100%; padding: 3.5vw 4vw; font-size: 16px;
            background: rgba(255,255,255,0.08); border: 2px solid rgba(0,162,255,0.3); 
            color: white; border-radius: 12px; outline: none;
            transition: all 0.3s ease;
        }
        .entrada:focus { border-color: #00d4ff; background: rgba(0,162,255,0.1); box-shadow: 0 0 15px rgba(0,212,255,0.2); }
        .fila-doble { display: flex; gap: 3vw; flex-wrap: wrap; }
        .columna { flex: 1; min-width: 130px; }
        .selector {
            width: 100%; padding: 3.5vw 4vw; font-size: 16px;
            background: rgba(255,255,255,0.08); border: 2px solid rgba(0,162,255,0.3); 
            color: white; border-radius: 12px; outline: none; appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'%3e%3cpath d='M7 10l5 5 5-5z'/%3e%3c/svg%3e");
            background-repeat: no-repeat; background-position: right 4vw center; background-size: 18px;
            transition: all 0.3s ease;
        }
        .selector:focus { border-color: #00d4ff; box-shadow: 0 0 15px rgba(0,212,255,0.2); }
        .contenedor-terminos { display: flex; align-items: flex-start; gap: 3vw; margin-top: 2vw; }
        .checkbox { width: 22px; height: 22px; margin-top: 0.5vw; accent-color: #00d4ff; }
        .texto-terminos { font-size: 13px; color: #a0c8e8; line-height: 1.6; }
        .enlace { color: #00d4ff; text-decoration: none; }
        .boton-crear {
            width: 100%; padding: 3.8vw; font-size: 18px; font-weight: bold;
            background: linear-gradient(90deg, #00a2ff 0%, #00d4ff 100%); 
            color: white; border: none; border-radius: 12px; cursor: pointer; margin-top: 2vw;
            transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(0,162,255,0.3);
        }
        .boton-crear:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,162,255,0.4); }
        .boton-crear:active { transform: translateY(0); }
        .mensaje-error { color: #ff6b6b; font-size: 14px; text-align: center; margin-top: 3vw; display: none; }
        .texto-iniciar-sesion { text-align: center; margin-top: 6vw; font-size: 15px; color: #90b8d8; }

        /* === PANTALLA PRINCIPAL === */
        #pantalla-principal {
            display: none; width: 100%; height: 100%;
            background: linear-gradient(180deg, #1e1e2f 0%, #2a2a40 50%, #1f1f30 100%);
            color: white; flex-direction: column; overflow-y: auto;
        }
        .barra-superior { 
            display: flex; align-items: center; justify-content: space-between; 
            padding: 3vw 4vw; background: rgba(0,0,0,0.2); backdrop-filter: blur(10px);
            position: sticky; top: 0; z-index: 50;
        }
        .menu-icono { font-size: 24px; cursor: pointer; }
        .logo-pequeño { font-family: 'Arial Black', sans-serif; font-size: clamp(22px, 6vw, 30px); font-weight: 900; }
        .o-girada { display: inline-block; transform: rotate(12deg); }
        .iconos-derecha { display: flex; align-items: center; gap: 5vw; font-size: 22px; }
        .iconos-derecha span { cursor: pointer; transition: transform 0.2s; }
        .iconos-derecha span:hover { transform: scale(1.2); }
        .perfil-usuario { 
            display: flex; align-items: center; gap: 3vw; padding: 4vw; margin: 3vw;
            background: rgba(255,255,255,0.05); border-radius: 16px; border: 1px solid rgba(255,255,255,0.1);
        }
        .avatar-usuario {
            width: 48px; height: 48px; border-radius: 50%;
            background: linear-gradient(135deg, #00a2ff 0%, #00d4ff 100%); 
            border: 3px solid #fff; flex-shrink: 0;
        }
        .nombre-usuario { font-size: 16px; font-weight: bold; flex: 1; }
        .etiqueta-verificar { 
            font-size: 11px; color: #aaa; background: rgba(255,255,255,0.1); 
            padding: 0.8vw 2vw; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1);
        }

        .seccion-amigos { padding: 0 4vw 5vw; }
        .titulo-seccion { font-size: 22px; font-weight: bold; margin-bottom: 4vw; }
        .buscar-amigo { display: flex; gap: 3vw; margin-bottom: 5vw; flex-wrap: wrap; }
        .entrada-buscar { 
            flex: 1; min-width: 180px; padding: 3.5vw 4vw; font-size: 16px;
            background: rgba(255,255,255,0.08); border: 2px solid rgba(0,162,255,0.3); 
            color: white; border-radius: 12px; outline: none; transition: all 0.3s ease;
        }
        .entrada-buscar:focus { border-color: #00d4ff; box-shadow: 0 0 15px rgba(0,212,255,0.2); }
        .boton-buscar { 
            padding: 3.5vw 5vw; background: linear-gradient(90deg, #00a2ff 0%, #00d4ff 100%); 
            color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: bold;
            transition: all 0.3s ease;
        }
        .boton-buscar:hover { transform: translateY(-2px); }
        .resultado-busqueda { 
            background: rgba(255,255,255,0.05); border: 1px solid rgba(0,162,255,0.3);
            border-radius: 16px; padding: 4vw; margin-bottom: 5vw; display: none;
        }
        .jugador-encontrado { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 3vw; }
        .info-jugador { display: flex; align-items: center; gap: 3vw; }
        .avatar-chico { 
            width: 44px; height: 44px; border-radius: 50%; 
            background: linear-gradient(135deg, #ff9800 0%, #ffc107 100%); 
            border: 2px solid #fff; flex-shrink: 0;
        }
        .boton-agregar { 
            padding: 2.5vw 4vw; background: linear-gradient(90deg, #28a745 0%, #4cd137 100%); 
            color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold;
            transition: all 0.3s ease;
        }
        .boton-agregar:hover { transform: scale(1.05); }
        .boton-agregar:disabled { background: #555; cursor: not-allowed; transform: none; }
        .lista-amigos { margin-top: 2vw; }
        .amigo-item { 
            display: flex; align-items: center; justify-content: space-between; 
            background: rgba(255,255,255,0.05); border-radius: 12px; padding: 3vw; margin-bottom: 2vw;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .sin-amigos { color: #8ab4d8; font-size: 15px; text-align: center; padding: 8vw 4vw; }
        .mensaje-exito { color: #4cd137; font-size: 14px; margin-top: 3vw; display: none; }
        .mensaje-no-encontrado { color: #ff6b6b; font-size: 14px; margin-top: 3vw; display: none; }

        .contenedor-boton-juegos { padding: 0 4vw 5vw; }
        .boton-juegos {
            width: 100%; max-width: 280px; height: 80px; 
            background: linear-gradient(135deg, #00a2ff 0%, #00d4ff 50%, #00a2ff 100%); 
            background-size: 200% 200%; animation: brillo 3s ease infinite;
            border: none; border-radius: 16px; color: white; font-size: 18px; font-weight: bold;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 20px rgba(0,162,255,0.3); transition: all 0.3s ease;
        }
        @keyframes brillo {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .boton-juegos:hover { transform: translateY(-3px); box-shadow: 0 6px 25px rgba(0,162,255,0.4); }

        .seccion-juegos { padding: 0 4vw 5vw; display: none; }
        .cuadro-juegos {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(0,162,255,0.3);
            border-radius: 20px; padding: 5vw; width: 100%; max-width: 360px; min-height: 200px; 
            position: relative; box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        .boton-cerrar { 
            position: absolute; top: 3vw; right: 4vw; background: rgba(255,68,68,0.2); 
            border: none; color: #ff6b6b; font-size: 22px; font-weight: bold; cursor: pointer;
            width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            transition: all 0.2s ease;
        }
        .boton-cerrar:hover { background: #ff4444; color: white; }
        .titulo-cuadro { font-size: 20px; font-weight: bold; margin-bottom: 5vw; padding-right: 8vw; }
        .sin-juegos { color: #8ab4d8; font-size: 15px; text-align: center; padding: 6vw 0; }
        .boton-crear-juego {
            width: 100%; padding: 3.5vw; background: linear-gradient(90deg, #00a2ff 0%, #00d4ff 100%); 
            color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; 
            cursor: pointer; margin-top: 3vw; transition: all 0.3s ease;
        }
        .boton-crear-juego:hover { transform: translateY(-2px); }
        .juego-item { 
            background: rgba(255,255,255,0.08); border-radius: 12px; padding: 3.5vw; 
            margin-bottom: 3vw; border: 1px solid rgba(255,255,255,0.1);
        }
        .juego-nombre { font-weight: bold; font-size: 16px; margin-bottom: 2.5vw; }
        .boton-jugar { 
            padding: 2vw 3.5vw; background: linear-gradient(90deg, #00a2ff 0%, #00d4ff 100%); 
            color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;
            transition: all 0.2s ease;
        }
        .boton-jugar:hover { transform: scale(1.05); }

        /* === EDITOR DE JUEGOS === */
        #editor-juegos {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
            z-index: 200; display: none; flex-direction: column;
        }
        .barra-superior-editor {
            display: flex; align-items: center; justify-content: space-between;
            padding: 3vw 4vw; background: rgba(0,0,0,0.3); border-bottom: 2px solid rgba(0,162,255,0.2); 
            flex-wrap: wrap; gap: 3vw;
        }
        .boton-volver { 
            background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); 
            padding: 2.5vw 4vw; border-radius: 10px; cursor: pointer; font-weight: bold;
            transition: all 0.2s ease;
        }
        .boton-volver:hover { background: rgba(255,255,255,0.2); }
        .entrada-nombre-juego { 
            padding: 2.5vw 3.5vw; background: rgba(255,255,255,0.08); 
            border: 2px solid rgba(0,162,255,0.3); color: white; border-radius: 10px; outline: none;
            min-width: 180px;
        }
        .entrada-nombre-juego:focus { border-color: #00d4ff; }
        .boton-codigo { 
            background: linear-gradient(90deg, #ff9800 0%, #ffc107 100%); 
            color: white; border: none; padding: 2.5vw 4vw; border-radius: 10px; cursor: pointer; font-weight: bold;
            transition: all 0.2s ease;
        }
        .boton-codigo:hover { transform: scale(1.05); }
        .boton-guardar { 
            background: linear-gradient(90deg, #28a745 0%, #4cd137 100%); 
            color: white; border: none; padding: 2.5vw 4vw; border-radius: 10px; cursor: pointer; font-weight: bold;
            transition: all 0.2s ease;
        }
        .boton-guardar:hover { transform: scale(1.05); }

        .contenedor-editor { display: flex; flex: 1; overflow: hidden; flex-direction: column; }
        .barra-herramientas {
            width: 100%; max-height: 220px; background: rgba(0,0,0,0.25); 
            border-bottom: 2px solid rgba(0,162,255,0.2); padding: 4vw; overflow-y: auto;
        }
        .titulo-herramientas { 
            font-size: 16px; font-weight: bold; margin-bottom: 3vw; padding-bottom: 2vw; 
            border-bottom: 1px solid rgba(255,255,255,0.1); color: #00d4ff;
        }
        .categoria { margin-bottom: 4vw; }
        .titulo-categoria { font-size: 13px; color: #8ab4d8; margin-bottom: 2vw; text-transform: uppercase; }
        .lista-objetos { display: grid; grid-template-columns: repeat(8, 1fr); gap: 2vw; }
        .objeto-bloque {
            width: 100%; aspect-ratio: 1; background: rgba(255,255,255,0.08); 
            border: 2px solid rgba(255,255,255,0.15); border-radius: 8px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: clamp(18px, 5vw, 26px); transition: all 0.2s ease;
        }
        .objeto-bloque:hover { 
            border-color: #00d4ff; background: rgba(0,162,255,0.15); 
            transform: scale(1.1); box-shadow: 0 0 12px rgba(0,212,255,0.3);
        }
        .objeto-bloque.seleccionado { 
            border-color: #00d4ff; background: rgba(0,162,255,0.25); 
            box-shadow: 0 0 15px rgba(0,212,255,0.4);
        }

        .lienzo-mapa { flex: 1; background: linear-gradient(180deg, #87CEEB 0%, #b8e6ff 100%); position: relative; overflow: auto; display: flex; align-items: center; justify-content: center; padding: 4vw; }
        .cuadricula-mapa {
            width: 100%; max-width: 800px; height: 500px; background: #71b871;
            background-image: linear-gradient(rgba(0,0,0,0.08) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0,0,0,0.08) 1px, transparent 1px);
            background-size: 40px 40px; position: relative; border-radius: 12px;
            box-shadow: inset 0 0 80px rgba(0,0,0,0.2); border: 3px solid rgba(0,0,0,0.1);
        }
        .elemento-colocado {
            position: absolute; cursor: move; font-size: 28px; width: 40px; height: 40px;
            display: flex; align-items: center; justify-content: center; z-index: 10;
        }
        .boton-eliminar {
            position: absolute; top: -8px; right: -8px; width: 22px; height: 22px;
            background: linear-gradient(135deg, #ff4444 0%, #ff6b6b 100%); color: white; border: none; border-radius: 50%;
            font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.2s ease; font-weight: bold;
        }
        .elemento-colocado:hover .boton-eliminar { opacity: 1; }

        /* === PANEL DE CÓDIGO === */
        #panel-codigo {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 300; display: none; flex-direction: column; padding: 4vw;
        }
        .barra-codigo { 
            display: flex; align-items: center; justify-content: space-between; margin-bottom: 4vw; 
            flex-wrap: wrap; gap: 3vw;
        }
        .titulo-codigo { font-size: 22px; font-weight: bold; color: #ffc107; }
        .boton-cerrar-codigo { 
            background: linear-gradient(135deg, #ff4444 0%, #ff6b6b 100%); 
            color: white; border: none; padding: 2.5vw 4vw; border-radius: 10px; cursor: pointer; font-weight: bold;
        }
        .boton-aplicar-codigo { 
            background: linear-gradient(90deg, #28a745 0%, #4cd137 100%); 
            color: white; border: none; padding: 2.5vw 4vw; border-radius: 10px; cursor: pointer; font-weight: bold;
        }
        .area-codigo {
            flex: 1; background: #0d1117; border: 2px solid #30363d; border-radius: 12px;
            padding: 4vw; color: #c9d1d9; font-family: 'Consolas', 'Monaco', monospace;
            font-size: 14px; line-height: 1.7; resize: none; outline: none;
        }
        .area-codigo:focus { border-color: #ffc107; box-shadow: 0 0 15px rgba(255,193,7,0.2); }
        .ejemplos-codigo { margin-top: 3vw; display: flex; gap: 2.5vw; flex-wrap: wrap; }
        .boton-ejemplo { 
            background: #21262d; color: #c9d1d9; border: 1px solid #30363d; 
            padding: 2vw 3.5vw; border-radius: 8px; cursor: pointer; font-size: 13px;
            transition: all 0.2s ease;
        }
        .boton-ejemplo:hover { background: #30363d; border-color: #ffc107; }

        @media (min-width: 768px) {
            .contenedor-editor { flex-direction: row; }
            .barra-herramientas { width: 280px; max-height: 100%; border-right: 2px solid rgba(0,162,255,0.2); border-bottom: none; }
            .lista-objetos { grid-template-columns: repeat(4, 1fr); }
            .cuadricula-mapa { width: 700px; height: 500px; }
        }
    </style>
</head>
<body>

    <!-- PORTADA - DURA 2 SEGUNDOS -->
    <div id="portada">
        <div class="logo-roblox">R<span class="letra-o">O</span>BLOX</div>
    </div>

    <!-- PANTALLA CREAR CUENTA -->

        <h1 class="titulo-pagina">Crear cuenta</h1>
        <form class="formulario" id="form-cuenta">

                        </select>
                    </div>
                    <div class="columna">
                        <select class="selector" id="select-dia">
